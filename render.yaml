# Alternate deployment path — an always-on host (no sleep-on-inactivity,
# unlike Streamlit Community Cloud's free tier), for later if that ever
# matters. NOT the primary path: Streamlit Community Cloud is free;
# Render's plans with enough memory for this app are not. Either way the
# database is external (Supabase/Postgres, set via DATABASE_URL) — Render
# itself holds no persistent disk here, since the app no longer keeps any
# state on its own filesystem.
services:
  - type: web
    name: ppc-intelligence
    env: python
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: DATABASE_URL
        sync: false
      - key: APP_PASSWORD
        sync: false
