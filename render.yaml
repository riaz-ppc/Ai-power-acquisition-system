services:
  - type: web
    name: ppc-intelligence
    env: python
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: DB_PATH
        value: /data/ppc_intelligence.db
      - key: APP_PASSWORD
        sync: false
    disk:
      name: ppc-intelligence-data
      mountPath: /data
      sizeGB: 1
